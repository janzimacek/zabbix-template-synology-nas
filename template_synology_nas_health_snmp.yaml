zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 99ef960f930140dc9b488fb26f167686
      name: Templates/Storage
  templates:
    - uuid: 32a0eecfb6904b34a65e7043d394e18d
      template: 'Synology NAS health by SNMP'
      name: 'Synology NAS health by SNMP'
      description: 'Synology NAS health monitoring for Zabbix 8.0 using SNMPv2 and Synology enterprise OIDs under 1.3.6.1.4.1.6574. Tested on a DS418 with DSM 7.4. Fixed layout: four disks (indexes 0-3) and one volume (index 0). Configure the SNMP interface and credentials only on the host.'
      groups:
        - name: Templates/Storage
      items:
        - uuid: 0f2d64bf9b444219b5000efbe4094f80
          name: 'Synology: ICMP availability'
          type: SIMPLE
          key: icmpping
          delay: 30s
          history: 90d
          description: 'ICMP availability of the NAS host interface.'
          valuemap:
            name: 'ICMP availability'
          triggers:
            - uuid: 1337929f2cb4402884b490f85cc4b42d
              expression: 'max(/Synology NAS health by SNMP/icmpping,3m)=0'
              name: 'Synology NAS: Unreachable by ICMP'
              priority: HIGH
              tags:
                - tag: component
                  value: availability
        - uuid: 1b3f590bacb4412e8fef4ca2848e360f
          name: 'Synology: Drive 1 bad sectors'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6574.2.1.1.9.0
          key: 'synology.disk.badsectors[0]'
          delay: 15m
          history: 90d
          triggers:
            - uuid: 0404aa67a8fa40c1a1ee56e774dbdf40
              expression: 'last(/Synology NAS health by SNMP/synology.disk.badsectors[0])>0'
              name: 'Synology NAS: Drive 1 has bad sectors'
              opdata: 'Bad sectors: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: component
                  value: disk
        - uuid: 116d9c4a9fc14a6e8cba8d2cfc17a2c4
          name: 'Synology: Drive 2 bad sectors'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6574.2.1.1.9.1
          key: 'synology.disk.badsectors[1]'
          delay: 15m
          history: 90d
          triggers:
            - uuid: 3d8b47c1079c4139a7d1f89b3b9e8729
              expression: 'last(/Synology NAS health by SNMP/synology.disk.badsectors[1])>0'
              name: 'Synology NAS: Drive 2 has bad sectors'
              opdata: 'Bad sectors: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: component
                  value: disk
        - uuid: 262f63e87d684943876fa95be315516e
          name: 'Synology: Drive 3 bad sectors'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6574.2.1.1.9.2
