          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6574.3.1.1.3.0
          key: 'synology.volume.status[0]'
          delay: 5m
          history: 90d
          valuemap:
            name: 'Synology RAID status'
          triggers:
            - uuid: 1a52b5ad0b2449e2bc1a08ad79a0e5f2
              expression: 'last(/Synology NAS health by SNMP/synology.volume.status[0])>=11'
              name: 'Synology NAS: Volume 1 is degraded or crashed'
              priority: DISASTER
              tags:
                - tag: component
                  value: volume
            - uuid: 10783aca2d53492ea4a44ea32adff119
              expression: 'last(/Synology NAS health by SNMP/synology.volume.status[0])<>1 and last(/Synology NAS health by SNMP/synology.volume.status[0])<11'
              name: 'Synology NAS: Volume 1 is not in normal state'
              priority: WARNING
              tags:
                - tag: component
                  value: volume
        - uuid: a191452f1bb8456d9e989975632cb154
          name: 'Synology: Volume 1 total space'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6574.3.1.1.5.0
          key: 'synology.volume.total[0]'
          delay: 1h
          history: 90d
          units: B
        - uuid: 7dbf94cb5c2a43278fa4bf4cadb521d6
          name: 'Synology: Volume 1 used space'
          type: CALCULATED
          key: 'synology.volume.used[0]'
          delay: 15m
          history: 90d
          units: B
          params: 'last(//synology.volume.total[0])-last(//synology.volume.free[0])'
        - uuid: 6ffaeb1082934df581f198061a7cf9a6
          name: 'Synology: Volume 1 utilization'
          type: CALCULATED
          key: 'synology.volume.utilization[0]'
          delay: 15m
          history: 90d
          value_type: FLOAT
          units: '%'
          params: '100*(last(//synology.volume.total[0])-last(//synology.volume.free[0]))/last(//synology.volume.total[0])'
          triggers:
            - uuid: 639cba32a7494026a6c602feedd210b0
              expression: 'avg(/Synology NAS health by SNMP/synology.volume.utilization[0],30m)>80'
              name: 'Synology NAS: Volume 1 utilization above 80%'
              opdata: 'Utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Synology NAS: Volume 1 utilization above 90%'
                  expression: 'avg(/Synology NAS health by SNMP/synology.volume.utilization[0],30m)>90'
              tags:
                - tag: component
                  value: capacity
            - uuid: da65374862a1495ab9540e53b8ada133
              expression: 'avg(/Synology NAS health by SNMP/synology.volume.utilization[0],30m)>90'
              name: 'Synology NAS: Volume 1 utilization above 90%'
              opdata: 'Utilization: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: component
                  value: capacity
