            name: 'Synology binary status'
          triggers:
            - uuid: 2d4b2cd0a5e84ae3b479a36a585cebf0
              expression: 'nodata(/Synology NAS health by SNMP/synology.system.status,15m)=1'
              name: 'Synology NAS: No SNMP data for 15 minutes'
              priority: AVERAGE
              dependencies:
                - name: 'Synology NAS: Unreachable by ICMP'
                  expression: 'max(/Synology NAS health by SNMP/icmpping,3m)=0'
              tags:
                - tag: component
                  value: snmp
            - uuid: 406ba13a046b4612a4b50b575b1f60fc
              expression: 'last(/Synology NAS health by SNMP/synology.system.status)<>1'
